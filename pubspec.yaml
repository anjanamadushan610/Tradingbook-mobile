name: trading_book
description: TradingBook — the social network for traders.
publish_to: 'none'

# versionName+versionCode. Bump the code (after +) on every Play upload.
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.3.0

  # Navigation
  go_router: ^18.0.1

  # Network
  dio: ^5.9.0
  web_socket_channel: ^3.0.3

  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5

  # Media
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5

  # Charts
  fl_chart: ^1.2.0

  # UI utilities
  shimmer: ^3.0.0
  timeago: ^3.7.1
  intl: ^0.20.2

  # Platform
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  pinput: ^6.0.2
  google_sign_in: ^7.2.0

  # Push notifications (inactive until android/app/google-services.json exists)
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3

  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.png
  color_dark: "#0D1117"
  android_12:
    color: "#FFFFFF"
    color_dark: "#0D1117"
    image: assets/images/splash_logo.png
